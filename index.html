<title>Korok Seeds</title>
<style>
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);background:#0B120C}
  html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0B120C}
  body{margin:0;background:#0B120C;min-height:100%}
</style>
</head>
<body>
<div id="app"><div class="boot">Opening the log…</div></div>

<style>
  #app{
    --parch:#F2E7CB; --parch2:#E6D6B0; --parch3:#DBC89C;
    --gold:#C9A227; --gold2:#8E6E20; --goldlt:#E3C366;
    --grn:#41663A; --grn2:#2C4526; --grn3:#1C2E19; --grnlt:#6E9455;
    --brown:#4A3A25; --ink:#2A2114; --soft:#7C6A4C;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:"Avenir Next",Optima,"Gill Sans","Segoe UI",system-ui,sans-serif;
    font-family:var(--sans);color:var(--ink);background:transparent;
    max-width:560px;margin:0 auto;padding:0;font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  #app .boot{color:var(--goldlt);text-align:center;padding:70px 0;font-family:var(--serif);
    font-size:15px;font-style:italic;letter-spacing:.04em}
  #app button{font:inherit;cursor:pointer;color:var(--ink);background:none;border:none}
  #app button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---- deep wood backdrop ---- */
  #app .frame{position:relative;padding:30px 13px 15px;border-radius:5px;
    background:
      radial-gradient(120% 70% at 50% 0%,rgba(110,148,85,.22),transparent 62%),
      linear-gradient(180deg,#1B2417,#0F1610 70%,#0B120C)}
  #app .orn{position:absolute;pointer-events:none;z-index:4;opacity:.95}
  #app .orn.t{top:-1px;left:0;right:0;height:30px}
  #app .orn.b,#app .orn.l,#app .orn.r{display:none}

  /* ---- parchment page ---- */
  #app .screen{position:relative;overflow:hidden;border-radius:3px;padding:17px 15px 0;
    background:
      repeating-linear-gradient(115deg,rgba(138,110,32,.035) 0 2px,transparent 2px 7px),
      linear-gradient(180deg,var(--parch),var(--parch2));
    border:1px solid var(--gold2);
    box-shadow:0 0 0 4px #2A2114, 0 0 0 5px var(--gold2), 0 16px 30px rgba(0,0,0,.5),
               inset 0 0 44px rgba(138,110,32,.14)}
  #app .screen::after{content:none}
  #app .sweep{position:absolute;inset:0;z-index:10;pointer-events:none;height:55%;
    background:linear-gradient(to bottom,transparent,rgba(255,246,214,.6),transparent);
    animation:sweep 1s ease-out forwards}
  @keyframes sweep{0%{transform:translateY(-130%)}100%{transform:translateY(240%);opacity:0}}

  /* ---- header ---- */
  #app .hud{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid rgba(138,110,32,.4)}
  #app .hud .blk{font-size:10px;letter-spacing:.1em;color:var(--soft);line-height:1.5}
  #app .hud .blk.r{text-align:right}
  #app .hud .v{font-family:var(--serif);font-size:18px;font-weight:400;color:var(--grn2);
    letter-spacing:.01em}
  #app .hud .blk.r .v{color:var(--gold2)}
  #app .hud .pct{font-family:var(--serif);font-size:13px;color:var(--grn)}
  #app .gl{display:none}
  #app .who{display:block;text-align:left}

  /* ---- tabs ---- */
  #app .tabs{display:flex;align-items:center;gap:0;padding:0;margin-bottom:15px;
    background:none;border-radius:0;border-bottom:1px solid rgba(138,110,32,.4)}
  #app .tabs .bdg{display:none}
  #app .tabs button{flex:1;padding:8px 3px 9px;font-family:var(--serif);font-size:13px;
    color:var(--soft);border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px;
    letter-spacing:.02em;box-shadow:none}
  #app .tabs button.on{color:var(--grn2);border-bottom-color:var(--gold);background:none;
    box-shadow:none;text-shadow:none}
  #app .pane{display:none;padding-bottom:14px} #app .pane.on{display:block}

  /* ---- gauge ---- */
  #app .gauge{position:relative;width:224px;height:224px;margin:4px auto 2px}
  #app .gauge svg{position:absolute;inset:0}
  #app .gauge .rot{transform:rotate(-90deg);transform-origin:111px 111px}
  #app .gauge .arc{transition:stroke-dashoffset .55s cubic-bezier(.25,.9,.3,1);filter:none}
  #app .gauge .arc2{transition:stroke-dashoffset .5s cubic-bezier(.25,.9,.3,1)}
  #app .gauge .halo{animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.1}50%{opacity:.26}}
  #app .gauge .spin{animation:spin 90s linear infinite;transform-origin:111px 111px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #app .gauge .mid{position:absolute;inset:30px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center}
  #app .gauge .n{font-family:var(--serif);font-size:54px;font-weight:400;line-height:1;
    letter-spacing:-.02em;color:var(--grn3);text-shadow:none}
  #app .gauge .of{font-size:9px;letter-spacing:.24em;color:var(--soft);margin-top:7px;
    text-transform:uppercase}
  #app .gauge.pulse .n{animation:pop .5s ease}
  @keyframes pop{0%{color:var(--gold2)}100%{color:var(--grn3)}}
  #app .gauge .rn{margin-top:11px;max-width:120px;font-family:var(--serif);font-size:12px;
    color:var(--brown);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #app .gauge .rc{font-family:var(--serif);font-size:16px;color:var(--gold2);margin-top:2px}

  /* ---- readouts ---- */
  #app .meta{display:flex;justify-content:center;gap:0;margin:13px 0 15px;
    border-top:1px solid rgba(138,110,32,.32);border-bottom:1px solid rgba(138,110,32,.32)}

      '<div class="line">'+
        '<button class="pick" data-pick="'+r.id+'">'+
          '<span class="nm">'+r.name+'</span>'+glyphs(r.name,Math.min(11,Math.ceil(r.name.length/2.4)),"#B98B2E",.9)+
          (r.tip?'<span class="tip">'+r.tip+'</span>':'')+
        '</button>'+
        '<span class="tal"><b>0</b> / '+(+r.target||0)+'</span>'+
        '<button class="step" data-minus="'+r.id+'" aria-label="Remove one from '+esc(r.short||r.name)+'">&minus;</button>'+
        '<button class="step" data-plus="'+r.id+'" aria-label="Add one to '+esc(r.short||r.name)+'">+</button>'+
      '</div><span class="bar"><em style="width:0"></em></span>'+
      '<a class="ign row-ign" href="'+linkOf(r)+'" target="_blank" rel="noopener">IGN guide \u2197</a>'+
      '</div>'}).join("");
    var guide=GUIDE.map(function(k,i){return '<div class="kd" data-kd="'+i+'">'+
      '<button class="hd" data-open="'+i+'"><span class="tick"></span>'+
      '<span class="ti">'+k.t+'</span><span class="tg">'+k.g+'</span></button>'+
      '<div class="bd">'+k.b+'</div></div>'}).join("");
    var bars="";for(var j=0;j<14;j++)bars+="<div></div>";

    app.innerHTML=
    '<div class="frame">'+
      '<i class="orn t"></i><i class="orn b"></i><i class="orn l"></i><i class="orn r"></i>'+
      '<div class="screen"><div class="sweep"></div>'+
        '<div class="hud">'+
          '<div class="blk"><span class="who"><span class="v nm"></span></span>'+
            glyphs("slate-owner",9,"#5FE3F5",.75)+'Seeds found <span class="pct">0.00%</span></div>'+
          '<div class="blk r"><span class="v tm"></span>'+glyphs("hyrule-clock",7,"#5FE3F5",.75)+
            'Nov 5 · <span class="v dd"></span> days</div>'+
        '</div>'+
        '<div class="tabs"><span class="bdg">L</span>'+
          '<button data-tab="count" class="on">COUNT</button>'+
          '<button data-tab="regions">REGIONS</button>'+
          '<button data-tab="guide">FIELD GUIDE</button>'+
          '<span class="bdg">R</span></div>'+

        '<div class="pane on" data-pane="count">'+
          '<div class="gauge"><svg viewBox="0 0 222 222">'+
            '<g class="spin">'+ticks()+'</g>'+
            '<circle class="halo" cx="111" cy="111" r="87" fill="none" stroke="#41663A" stroke-width="16" opacity=".16"/>'+
            '<circle cx="111" cy="111" r="87" fill="none" stroke="rgba(138,110,32,.25)" stroke-width="9"/>'+
            '<g class="rot"><circle class="arc" cx="111" cy="111" r="87" fill="none" stroke="#41663A" stroke-width="9"'+
              ' stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></g>'+
            '<circle cx="111" cy="111" r="72" fill="none" stroke="rgba(138,110,32,.2)" stroke-width="5"/>'+
            '<g class="rot"><circle class="arc2" cx="111" cy="111" r="72" fill="none" stroke="#C9A227"'+
              ' stroke-width="5" stroke-linecap="butt" stroke-dasharray="'+C2+'" stroke-dashoffset="'+C2+'"/></g>'+
            '<circle cx="111" cy="111" r="62" fill="none" stroke="rgba(138,110,32,.28)" stroke-width="1"/>'+
            '</svg><div class="mid"><span class="n">0</span>'+glyphs("korok-seeds",7,"#E6C378",.9)+
            '<span class="of">of 900 seeds</span>'+
            '<span class="rn"></span><span class="rc">0 / 0</span></div></div>'+
          '<div class="meta"><span class="a">today<b class="td">0</b></span>'+
            '<span>this week<b class="wk">0</b></span>'+
            '<span>to go<b class="lf">900</b></span></div>'+
          '<div class="stats">'+
            '<div class="stat need"><span>need a day</span><strong>0</strong></div>'+
            '<div class="stat pace"><span>your pace</span><strong>0</strong></div>'+
            '<div class="stat eta"><span>finishing</span><strong>&mdash;</strong></div></div>'+
        '</div>'+

        '<div class="pane" data-pane="regions"><h4>Regions</h4>'+'<p class="note">Tap a region to aim the counter at it. Counts follow IGN\'s breakdown '+
          'and add up to exactly 900.</p>'+rows+
          '<h4 style="margin-top:20px">Last 14 days</h4><div class="bars">'+bars+'</div>'+
          '<div class="cap"></div></div>'+

        '<div class="pane" data-pane="guide"><h4>What to look for</h4>'+guide+'<p class="note" style="margin-top:16px">No seeds at all on Death Mountain, Eventide Island, inside the Korok Forest, at Thyphlo Ruins, in the three Lomei labyrinths, or across most of the Tabantha Tundra. Don\'t waste sweeps on them.</p></div>'+

        '<div class="legend">'+
          '<button class="a" data-one="1">'+
            '<span class="atxt"><span class="asub">Found one in</span>'+
            '<span class="alab"></span></span></button>'+
          '<button class="s" data-undo="1"><span class="snum">\u2212</span>'+
            '<span class="slab">undo</span></button>'+
          '<button class="s" data-five="1"><span class="snum">+5</span>'+
            '<span class="slab">batch</span></button></div>'+
        '<div class="foot"><span class="msg"></span><span class="rmn"></span>'+
          '<button class="rs" data-reset="1">Reset</button></div>'+
      '</div>'+
    '</div>';

    app.querySelector(".orn.t").style.background=ornTile(false)+" repeat-x center";
    app.querySelector(".orn.b").style.background=ornTile(false)+" repeat-x center";
    app.querySelector(".orn.l").style.background=ornTile(true)+" repeat-y center";
    app.querySelector(".orn.r").style.background=ornTile(true)+" repeat-y center";

    el.n=app.querySelector(".n");el.arc=app.querySelector(".arc");el.g=app.querySelector(".gauge");
    el.arc2=app.querySelector(".arc2");el.rn=app.querySelector(".rn");el.rc=app.querySelector(".rc");
    el.td=app.querySelector(".td");el.wk=app.querySelector(".wk");el.lf=app.querySelector(".lf");
    el.dd=app.querySelector(".dd");el.nm=app.querySelector(".hud .nm");el.tm=app.querySelector(".tm");
    el.alab=app.querySelector(".alab");el.msg=app.querySelector(".msg");
    el.pct=app.querySelector(".pct");el.rmn=app.querySelector(".rmn");
    el.bars=app.querySelectorAll(".bars div");el.cap=app.querySelector(".cap");
    el.need=app.querySelector(".stat.need strong");
    el.pace=app.querySelector(".stat.pace");el.paceN=app.querySelector(".stat.pace strong");
    el.eta=app.querySelector(".stat.eta");el.etaN=app.querySelector(".stat.eta strong");
    setTab(S.tab);
    el.tm.textContent=clock();setInterval(function(){el.tm.textContent=clock()},30000);
    setTimeout(function(){var s=app.querySelector(".sweep");if(s)s.remove()},1400);
  }

  function setTab(t){
    S.tab=t;
    [].forEach.call(app.querySelectorAll(".tabs button"),function(b){b.className=b.dataset.tab===t?"on":""});
    [].forEach.call(app.querySelectorAll(".pane"),function(p){p.className="pane"+(p.dataset.pane===t?" on":"")});
  }

  function paint(hit){
    var t=total(),left=TOTAL-t,dl=daysLeft(),need=dl>0?left/dl:left,r7=rate7();
    el.n.textContent=t;
    el.arc.setAttribute("stroke-dashoffset",C-(t/TOTAL)*C);
    if(hit){el.g.classList.remove("pulse");void el.g.offsetWidth;el.g.classList.add("pulse")}
    el.td.textContent=S.daily[today()]||0;
    var wk=0;last(7).forEach(function(x){wk+=x.v});
    el.wk.textContent=wk;el.lf.textContent=left;el.dd.textContent=dl;
    el.nm.textContent=S.name;
    var sel=REGIONS.filter(function(x){return x.id===S.sel})[0]||REGIONS[0];
    el.alab.textContent=sel?String(sel.short||sel.name):"No regions";
    var rc=sel?(S.counts[sel.id]||0):0,rt=sel?(+sel.target||0):0;
    el.rn.textContent=sel?String(sel.name):"";
    el.rc.textContent=rc+" / "+rt;
    el.arc2.setAttribute("stroke-dashoffset",C2-(rt?Math.min(1,rc/rt):0)*C2);
    el.arc2.setAttribute("stroke",rt&&rc>=rt?"#41663A":"#C9A227");

    REGIONS.forEach(function(r){
      var row=app.querySelector('[data-row="'+r.id+'"]');if(!row)return;
      var c=S.counts[r.id]||0;
      row.className="row"+(r.id===S.sel?" sel":"")+(c>=r.target?" done":"");
      row.querySelector(".bar em").style.width=Math.min(100,c/r.target*100)+"%";
      row.querySelector(".tal b").textContent=c;
    });

    el.need.textContent=left===0?"0":need.toFixed(1);
    el.paceN.textContent=r7.toFixed(1);
    el.pace.className="stat pace"+(r7<need?" behind":"");
    if(left===0){el.etaN.textContent="Done!";el.eta.className="stat eta"}
    else if(r7<=0){el.etaN.innerHTML="&mdash;";el.eta.className="stat eta"}
    else{var e=new Date(Date.now()+Math.ceil(left/r7)*864e5);
      el.etaN.textContent=fmt(e);el.eta.className="stat eta"+(e>DEADLINE?" late":"")}

    var d14=last(14),max=1,sum=0;
    d14.forEach(function(x){if(x.v>max)max=x.v;sum+=x.v});
    d14.forEach(function(x,i){el.bars[i].style.height=Math.max(2,x.v/max*40)+"px";
      el.bars[i].className=i===13?"now":""});
    var st=streak();
    el.cap.textContent=sum+" seeds"+(st>1?" · "+st+"-day streak":"");
    el.pct.textContent=((SHRINES+LOCATIONS+t)/ALL*100).toFixed(2)+"%";
    el.rmn.textContent=left+" to go";
  }

  app.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.tab)return setTab(b.dataset.tab),save();
    if(b.dataset.plus)return bump(b.dataset.plus,1);
    if(b.dataset.minus)return bump(b.dataset.minus,-1);
    if(b.dataset.one)return bump(S.sel,1);
    if(b.dataset.five)return bump(S.sel,5);
    if(b.dataset.undo)return bump(S.sel,-1);
    if(b.dataset.pick){S.sel=b.dataset.pick;paint();save();return}
    if(b.dataset.open!==undefined){
      var card=app.querySelector('[data-kd="'+b.dataset.open+'"]'),was=card.classList.contains("open");
      [].forEach.call(app.querySelectorAll(".kd"),function(c){c.classList.remove("open")});
      if(!was)card.classList.add("open");return}
    if(b.dataset.reset){if(confirm("Wipe every region and the daily log?")){
      REGIONS.forEach(function(r){S.counts[r.id]=0});S.daily={};paint();save()}}
  });

  ["pagehide","visibilitychange","freeze","blur"].forEach(function(ev){
    window.addEventListener(ev,function(){
      if(ev==="visibilitychange"&&document.visibilityState!=="hidden")return;
      flush();
    });
  });

  load();
})();
</script>

</body>
</html>
